<!DOCTYPE html>
<html lang="en">
<head>
     <link rel="icon" href="Raspberrry_pi_logo_AI.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi AI - Home of the Hampspeed</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('holywallpaper.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        /* New style to align the image and widget side-by-side */
        .project-showcase {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
            flex-wrap: wrap; /* Ensures it looks fine on mobile screens too */
        }
        /* Styling for the subscription list */
        .subscription-list {
            list-style: none;
            padding: 0;
            margin: 20px 0;
        }
        .subscription-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background-color: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .plan-info {
            font-size: 1.1em;
        }
        .plan-name {
            font-weight: bold;
        }
        .continue-btn {
            background-color: #c51a4a; /* A raspberry-ish red tone */
            color: white;
            border: none;
            padding: 8px 16px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .continue-btn:hover {
            background-color: #a01239;
        }

        /* Verse widget styling */
        #wallpi-verse-widget {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        #verse-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.6em;
            font-weight: 700;
            letter-spacing: 1px;
            color: #d4af37;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        #verse-value {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.6em;
            font-weight: 500;
            line-height: 1.6;
            color: #2c2c2c;
            position: relative;
            padding: 0 30px;
        }

        #verse-value::before {
            content: "\201C";
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            font-style: normal;
            color: #d4af37;
            vertical-align: -0.3em;
            margin-right: 4px;
        }

        #verse-value::after {
            content: "\201D";
            font-family: 'Playfair Display', serif;
            font-size: 1.4em;
            font-style: normal;
            color: #d4af37;
            vertical-align: -0.3em;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pi AI - Home of the Hampspeed </h1> <img src="raspberrry_pi_logo_holy.png" width="250"> 
        <h2> About </h2>
        <h3>The Wall Pi is more than just a cheap computer taped to the wall by an idiot. Its also “better”* than ChatGPT!</h3>
       <h1> *if your metric is being completely lobotomized </h1>
        

</body>
</html>
